# Temporary: builds the provider subpackages we run with the shared-transport
# azurerm fix (crossplane-contrib/provider-upjet-azure#1349) and publishes
# them to ghcr.io/axiansinfoma. The family provider is not rebuilt; the
# subpackages keep depending on the upstream one.
name: Publish shared-transport packages

on:
  workflow_dispatch:
    inputs:
      subpackages:
        description: "Subpackages to build (space separated)"
        default: "authorization insights managedidentity sql storage"
        required: true
      version:
        description: "Version to publish (e.g. v2.8.0-pooled.1)"
        required: true

permissions:
  contents: read
  packages: write

env:
  DOCKER_BUILDX_VERSION: 'v0.20.1'
  REGORG: 'ghcr.io/axiansinfoma'
  CONFIG_DEPENDENCY_REGORG: 'xpkg.crossplane.io/crossplane-contrib'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Keep temp files off the size-capped tmpfs /tmp
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Cleanup Disk
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          tool-cache: true
          large-packages: false
          swap-storage: false

      # Linking the azurerm-based binaries needs more than the runner's RAM.
      - name: Add swap
        run: |
          sudo fallocate -l 16G /mnt/build-swap
          sudo chmod 600 /mnt/build-swap
          sudo mkswap /mnt/build-swap
          sudo swapon /mnt/build-swap
          free -h

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true

      - name: Login to GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4
        with:
          submodules: true

      - name: Fetch History
        run: git fetch --prune --unshallow

      - name: Setup Go
        uses: actions/setup-go@6edd4406fa81c3da01a34fa6f6343087c207a568 # v3
        with:
          go-version-file: go.mod

      - name: Vendor Dependencies
        run: make vendor vendor.check

      - name: Build Artifacts
        run: |
          make -j 1 PLATFORMS=linux_amd64 BATCH_PLATFORMS=linux_amd64 SUBPACKAGES="${{ inputs.subpackages }}" XPKG_REG_ORGS="${{ env.REGORG }}" XPKG_REG_ORGS_NO_PROMOTE="${{ env.REGORG }}" CONFIG_DEPENDENCY_REG_ORG="${{ env.CONFIG_DEPENDENCY_REGORG }}" BRANCH_NAME="main" VERSION="${{ inputs.version }}" build.all
        env:
          BUILD_ARGS: "--load"

      - name: Publish Artifacts
        run: |
          make -j 1 PLATFORMS=linux_amd64 BATCH_PLATFORMS=linux_amd64 SUBPACKAGES="${{ inputs.subpackages }}" XPKG_REG_ORGS="${{ env.REGORG }}" XPKG_REG_ORGS_NO_PROMOTE="${{ env.REGORG }}" CONFIG_DEPENDENCY_REG_ORG="${{ env.CONFIG_DEPENDENCY_REGORG }}" BRANCH_NAME="main" VERSION="${{ inputs.version }}" publish
